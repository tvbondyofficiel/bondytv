<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publicité · Bondy TV Magazine</title>
<meta name="description" content="Le magazine gratuit de Bondy : ville, portraits, économie, politique locale et engagement citoyen.">
<meta name="theme-color" content="#0c0e16">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bondy TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>

/* Concept : une de magazine noir, rouge et blanc. Logo géant, titres condensés en majuscules, trame de points en motif, articles en grille éditoriale. */
:root {
  --bg: #0c0e16;
  --surface: #151824;
  --fg: #f4f2ee;
  --muted: #a6aab8;
  --red: #e8222d;
  --green: #2fb36d;
  --on-green: #04140b;
  --on-red: #ffffff;
  --line: rgba(255,255,255,.16);
  --dot: rgba(255,255,255,.22);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f4f1; --surface: #ffffff; --fg: #12141c; --muted: #555a69;
    --red: #d3141f; --green: #006233; --on-green: #ffffff; --line: rgba(18,20,28,.16); --dot: rgba(18,20,28,.2);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f4f1; --surface: #ffffff; --fg: #12141c; --muted: #555a69;
  --red: #d3141f; --green: #006233; --on-green: #ffffff; --line: rgba(18,20,28,.16); --dot: rgba(18,20,28,.2);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; }

/* barre de navigation */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar .mini { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 28px; line-height: 1; text-decoration: none; }
.bar .mini span { color: var(--red); }
.bar .mini img { display: block; height: 44px; width: auto; }
.bar nav { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: 15px; }
.bar nav a { text-decoration: none; color: var(--muted); }
.bar nav a:hover { color: var(--fg); }

/* une */
.une { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; padding: 40px 0 48px; align-items: center; }
.logo { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.logo .name { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(110px, 17vw, 200px); line-height: .85; letter-spacing: -.02em; }
.logo .name b { color: var(--red); font-weight: 800; }
.logo .side { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.logo .tv { font-family: var(--display); font-weight: 700; font-size: 46px; line-height: 1; letter-spacing: .08em; }
.logo .no1 { background: var(--red); color: var(--on-red); font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; padding: 10px 18px; width: max-content; }
.mag { font-family: var(--display); font-weight: 700; letter-spacing: .38em; font-size: 22px; text-transform: uppercase; margin-top: 18px; }
.photo { position: relative; margin-top: 28px; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-weight: 500; }
.photo::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1.6px, transparent 2px); background-size: 14px 14px; -webkit-mask-image: radial-gradient(circle at 30% 60%, #000, transparent 70%); mask-image: radial-gradient(circle at 30% 60%, #000, transparent 70%); }
.photo span { position: relative; }
.photo.has-img { padding: 0; aspect-ratio: 3 / 2; }
.photo.has-img::before { display: none; }
.photo.has-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 35% 30%; }
.art .vis.has-img { padding: 0; aspect-ratio: 16 / 9; }
.art .vis.has-img::before { display: none; }
.art .vis.has-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 35% 25%; }
.art .vis.has-ill { padding: 0; aspect-ratio: 16 / 7.2; }
.art .vis.has-ill::before { display: none; }
.ill { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ill .sky { fill: var(--surface); }
.ill .wt { fill: var(--line); }
.ill .gd { stroke: var(--muted); stroke-width: 2; }
.ill .bd { fill: var(--muted); opacity: .55; }
.ill .wd { fill: var(--surface); }
.ill .arch { fill: none; stroke: var(--red); stroke-width: 8; stroke-linecap: round; }
.ill .hg { stroke: var(--red); stroke-width: 3; }
.ill .deck { fill: var(--red); }
.ill .lb { fill: var(--fg); font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .3em; }
.art .vis.has-play { aspect-ratio: 16 / 7; }
.play { position: relative; width: 84px; height: 84px; border-radius: 50%; background: var(--red); display: block; }
.play::after { content: ""; position: absolute; left: 33px; top: 24px; border-left: 28px solid var(--on-red); border-top: 18px solid transparent; border-bottom: 18px solid transparent; }
.vlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
.art .vis.has-video { padding: 0; aspect-ratio: 16 / 9; background: #000; }
.art .vis.has-video::before { display: none; }
.art .vis.has-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.art .vis.has-logo { aspect-ratio: 16 / 7; }
.art .vis.has-logo img { position: relative; height: 66%; width: auto; max-width: 70%; display: block; }
.photo.has-art { aspect-ratio: 3 / 4; max-width: 520px; margin-left: auto; margin-right: auto; }
.photo.has-plain { aspect-ratio: 16 / 9; }
.photo.has-plain img { object-position: 50% 50%; }
.photo.has-art img { object-position: 50% 40%; }
.photo.has-art .stamp { top: 14px; bottom: auto; left: 14px; width: 84px; height: 84px; font-size: 16px; }
.photo.has-logo img { position: relative; width: 62%; height: auto; display: block; }
.art .vis.has-img.is-portrait { aspect-ratio: 4 / 3; }
.art .vis.has-img.is-portrait img { object-position: 50% 20%; }
.credit { font-size: 13px; color: var(--muted); margin: 0; }
.stamp { position: absolute; left: 14px; bottom: 14px; border: 3px double var(--fg); border-radius: 50%; width: 92px; height: 92px; display: grid; place-items: center; text-align: center; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: .04em; color: var(--fg); transform: rotate(-8deg); background: var(--bg); }

.lines { display: flex; flex-direction: column; gap: 22px; }
.lines a { text-decoration: none; font-family: var(--display); text-transform: uppercase; line-height: .98; font-weight: 600; font-size: clamp(34px, 5vw, 56px); border-bottom: 1px solid var(--line); padding-bottom: 20px; display: block; }
.lines a small { display: block; font-size: .5em; text-transform: none; color: var(--muted); letter-spacing: .02em; margin-top: 6px; }
.lines a:hover { color: var(--red); }
.lines a.last { background: var(--red); color: var(--on-red); padding: 16px 18px; border: 0; }
.lines a.last small { color: var(--on-red); opacity: .9; }
.lines a.last:hover { color: var(--on-red); filter: brightness(1.08); }

/* titres de section */
.sec-title { font-family: var(--display); text-transform: uppercase; font-weight: 700; letter-spacing: .1em; font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 14px; margin: 0 0 22px; }
.sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* sommaire */
#sommaire { padding: 8px 0 44px; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 56px; }
.toc a em { white-space: nowrap; }
.toc li { border-bottom: 1px solid var(--line); }
.toc a { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; text-decoration: none; font-family: var(--display); font-size: 24px; text-transform: uppercase; font-weight: 600; }
.toc a em { font-style: normal; color: var(--red); font-weight: 700; }
.arch-intro, .arch-more { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0 0 18px; max-width: 62ch; }
.arch-more { margin-top: 18px; }
.grid.arch-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.arch-grid .art .vis { aspect-ratio: 16 / 10; }
.arch-grid .art .txt { padding: 16px 16px 18px; gap: 8px; }
.arch-grid .art h3 { font-size: clamp(24px, 2.6vw, 30px); }
.arch-grid .art .chapo { font-size: 15px; }
.arch-grid .art .vis .play { transform: scale(.7); }
.arch-soon { margin: 22px 0 0; padding: 14px 18px; border-left: 4px solid var(--red); background: var(--surface); font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; font-size: 16px; color: var(--muted); }
.arch-soon strong { color: var(--red); margin-right: 8px; }
@media (max-width: 900px) { .grid.arch-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .grid.arch-grid { grid-template-columns: minmax(0, 1fr); } }

.arch-sub { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 26px; letter-spacing: .04em; margin: 34px 0 16px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
.vcard { margin: 0; border: 1px solid var(--line); background: var(--surface); }
.vcard video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; object-fit: cover; }
.vcard figcaption { padding: 12px 14px 14px; font-family: var(--display); font-size: 20px; line-height: 1.1; text-transform: uppercase; font-weight: 600; }
.vcard figcaption small { display: block; margin-top: 6px; font-family: var(--body); font-size: 14px; text-transform: none; font-weight: 400; color: var(--muted); }
.vempty { color: var(--muted); margin: 0; }
.toc a:hover { color: var(--red); }

/* filtres */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.filters button { font: 700 15px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 11px 16px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--on-red); }

/* articles */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
.art { background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; scroll-margin-top: 20px; }
.art.wide { grid-column: 1 / -1; }
.art .vis { aspect-ratio: 16 / 7; position: relative; border-bottom: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-size: 14px; }
.art .vis::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1.4px, transparent 1.8px); background-size: 12px 12px; -webkit-mask-image: linear-gradient(100deg, #000, transparent 75%); mask-image: linear-gradient(100deg, #000, transparent 75%); }
.art .vis span { position: relative; }
.art .txt { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 12px; }
.tag { font-family: var(--display); text-transform: uppercase; letter-spacing: .16em; font-weight: 700; font-size: 14px; color: var(--red); }
.art h3 { margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(32px, 4.4vw, 46px); line-height: .98; text-wrap: balance; }
.art p { margin: 0; max-width: 62ch; }
.art .chapo { color: var(--muted); }
details summary { cursor: pointer; font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: 15px; list-style: none; width: max-content; border-bottom: 2px solid var(--red); padding-bottom: 2px; }
details summary::-webkit-details-marker { display: none; }
details[open] summary { margin-bottom: 14px; }
details .more { display: flex; flex-direction: column; gap: 12px; }
.fill { background: color-mix(in srgb, var(--red) 22%, transparent); color: inherit; padding: 0 4px; border-radius: 2px; }
.more ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--red); padding-left: 12px; }

/* appel final */
.cta { margin-top: 56px; background: var(--red); color: var(--on-red); padding: 34px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.cta h2 { margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(36px, 6vw, 64px); line-height: .95; text-wrap: balance; }
.cta p { margin: 0; max-width: 60ch; }
.contact { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.c-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.c-row a { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4.5vw, 40px); line-height: 1.1; color: var(--on-red); text-decoration-thickness: 2px; text-underline-offset: 4px; overflow-wrap: anywhere; }
.copy { font: 700 14px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; background: transparent; color: var(--on-red); border: 2px solid var(--on-red); padding: 8px 12px; cursor: pointer; }
.copy:focus-visible, .c-row a:focus-visible { outline-color: var(--on-red); }
.temoigner { margin-top: 56px; }
.temoigner .intro { max-width: 62ch; margin: 0 0 22px; color: var(--muted); }
.temoigner { display: grid; grid-template-columns: minmax(0, 1fr) 340px; column-gap: 56px; align-items: start; }
.temoigner .sec-title, .temoigner .intro { grid-column: 1 / -1; }
.temoigner .tform { grid-column: 1; }
.t-side { grid-column: 2; grid-row: 3; position: sticky; top: 24px; border-left: 4px solid var(--red); background: var(--surface); padding: 28px 26px; }
.t-side blockquote { margin: 0 0 14px; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(32px, 3.4vw, 42px); line-height: .98; }
.t-side .t-auteur { font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-weight: 700; font-size: 14px; color: var(--red); margin: 0 0 16px; }
.t-side p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
@media (max-width: 900px) { .temoigner { grid-template-columns: minmax(0, 1fr); } .t-side { grid-column: 1; grid-row: auto; position: static; margin-top: 28px; } }

.tform { display: flex; flex-direction: column; gap: 16px; max-width: 720px; }
.tform .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tform .fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tform label { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: 15px; }
.tform .opt { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; font-family: var(--body); font-size: 14px; }
.tform input[type="text"], .tform input[type="url"], .tform select, .tform textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 12px 14px; width: 100%; min-width: 0; }
.tform input[type="file"] { font: inherit; color: var(--fg); max-width: 100%; }
.tform textarea { min-height: 130px; resize: vertical; }
.tform .check { display: flex; gap: 10px; align-items: flex-start; font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 15px; }
.tform .check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--red); flex: none; }
.tform .hint { font-size: 14px; color: var(--muted); margin: 0; }
.tform .send { align-self: flex-start; font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: .12em; background: var(--red); color: var(--on-red); border: 0; padding: 16px 28px; cursor: pointer; }
.tform .send[disabled] { opacity: .6; cursor: progress; }
.tform .status { margin: 0; font-weight: 600; min-height: 1.4em; }
.tform .status.err { color: var(--red); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
@media (max-width: 620px) { .tform .row2 { grid-template-columns: minmax(0, 1fr); } }
.c-row a.wa { display: inline-grid; place-items: center; width: 40px; height: 40px; color: var(--on-red); text-decoration: none; }
.c-row a.wa svg { width: 38px; height: 38px; display: block; }
.c-row a.wa:hover { opacity: .8; }
.walink { color: var(--red); font-weight: 600; }
.follow { display: flex; flex-direction: column; gap: 10px; }
.follow-t { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: 15px; color: var(--fg); }
.social { display: flex; gap: 12px; align-items: center; }
.social a { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--fg); text-decoration: none; }
.social a:hover { background: var(--red); border-color: var(--red); color: var(--on-red); }
.social svg { width: 22px; height: 22px; display: block; }
footer { margin-top: 36px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 18px; }

@media (min-width: 821px) {
  .une { align-items: stretch; }
  .une > div:first-child { display: flex; flex-direction: column; min-width: 0; }
  .photo.has-plain { flex: 1 1 auto; aspect-ratio: auto; min-height: 360px; margin-top: 24px; border: 0; box-shadow: 0 0 0 1px var(--line), 10px 10px 0 var(--beige); }
  .photo.has-plain img { object-position: 52% 55%; }
}

@media (max-width: 820px) {
  .une { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 28px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .logo .tv, .logo .no1 { font-size: 34px; }
}
@media (prefers-reduced-motion: no-preference) {
  .lines a, .filters button, .toc a { transition: color .15s ease, background-color .15s ease, filter .15s ease; }
}



.btn-all { display: inline-block; font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: .12em; background: var(--red); color: var(--on-red); padding: 16px 28px; text-decoration: none; }
.fbtn { margin: 36px 0 8px; }
.bar nav a[aria-current="page"] { border-bottom: 2px solid var(--red); }
.pagehead { margin: 40px 0 0; }

.edito-page { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 56px; align-items: start; margin-top: 48px; }
.edito-page .tag { font-family: var(--display); text-transform: uppercase; letter-spacing: .18em; font-weight: 700; font-size: 16px; color: var(--red); }
.edito-page h1 { margin: 10px 0 18px; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(44px, 7vw, 92px); line-height: .94; text-wrap: balance; }
.edito-page .lede { font-size: clamp(20px, 2.4vw, 26px); line-height: 1.4; color: var(--muted); margin: 0 0 28px; border-left: 4px solid var(--red); padding-left: 18px; }
.edito-page .corps p { font-size: 19px; line-height: 1.65; margin: 0 0 18px; max-width: 62ch; }
.edito-page .corps p:first-child::first-letter { font-family: var(--display); font-weight: 700; font-size: 3.6em; line-height: .8; float: left; padding: 6px 10px 0 0; color: var(--red); }
.edito-page .corps strong { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 1.15em; }
.edito-photo { position: sticky; top: 24px; }
.edito-photo img { width: 100%; max-width: 210px; display: block; border: 1px solid var(--line); box-shadow: 6px 6px 0 var(--red); }
.edito-photo figcaption { margin-top: 22px; font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-size: 15px; color: var(--muted); }
@media (max-width: 820px) { .edito-page { grid-template-columns: minmax(0, 1fr); gap: 32px; } .edito-photo { position: static; order: -1; } .edito-photo img { box-shadow: 8px 8px 0 var(--red); width: 50%; max-width: 200px; } }
.edito-photo figcaption { display: flex; flex-direction: column; gap: 4px; }
.edito-photo figcaption strong { font-size: 24px; line-height: 1; letter-spacing: .04em; color: var(--fg); }
.edito-photo figcaption span { letter-spacing: .14em; }
.edito-photo img { aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 50%; }
[hidden] { display: none !important; }
a.vis { text-decoration: none; color: inherit; }
.vis.has-play:hover .play { filter: brightness(1.1); }
.art .vis.has-video { aspect-ratio: 16 / 9; background: #000; }
.art .vis.has-video video { width: 100%; height: 100%; object-fit: contain; display: block; }
.loading { padding: 60px 0; color: var(--muted); font-size: 20px; }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
#install { font: 700 15px/1 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .1em; background: #e8222d; color: #fff; border: 0; padding: 11px 16px; cursor: pointer; }
#iosHint { margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--line); font-size: 15px; color: var(--muted); }

/* vert : touche du drapeau du Maroc */
body::before { content: ""; display: block; height: 6px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background: linear-gradient(90deg, var(--red) 0 78%, var(--green) 78% 100%); }
.sec-title::before { content: ""; width: 12px; height: 12px; background: var(--green); flex: none; }
.bar nav a:hover { color: #12141c; }
.edito-page .lede { border-left-color: var(--green); }
.t-side { border-left-color: var(--green); }
.t-side .t-auteur { color: #12141c; }
.arch-soon { border-left-color: var(--green); }
.arch-soon strong { color: #12141c; }
.social a:hover { color: #12141c; border-color: var(--green); }

/* équilibre rouge / vert */
body::before { background: linear-gradient(90deg, #d9c9a0 0 50%, var(--green) 50% 100%); }
.toc li:nth-child(even) a em { color: #12141c; }
.toc a:hover, .lines a:hover { color: #12141c; }
.grid > .art:nth-child(even) .tag { color: #12141c; }
.grid > .art:nth-child(even) .play { background: var(--green); }
.grid > .art:nth-child(even) .play::after { border-left-color: var(--on-green); }
.btn-all { background: var(--green); color: var(--on-green); }
.filters button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.edito-page .corps p:first-child::first-letter { color: #12141c; }
.bar nav a[aria-current="page"] { border-bottom-color: var(--green); }
.walink { color: #12141c; }
.tform .check input { accent-color: var(--green); }
.social a:hover { background: var(--green); border-color: var(--green); color: var(--on-green); }

/* beige : lignes de couverture et n°1 en vert */
:root { --beige: #e8dcc0; --on-beige: #12141c; }
.logo .no1 { background: var(--green); color: var(--on-green); }
.logo .name b { color: inherit; }
.lines a.last { background: var(--beige); color: var(--on-beige); }
.lines a.last small { color: var(--on-beige); opacity: .75; }
.lines a.last:hover { color: #12141c; filter: none; }


/* publicité en fenêtre (location d'espace) */
.pubpop { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 20px; background: rgba(8,10,16,.82); opacity: 0; transition: opacity .35s ease; }
.pubpop.on { opacity: 1; }
.pubpop .box { position: relative; width: min(680px, 100%); max-height: 90vh; overflow: auto; background: #0c0e16; color: #f4f2ee; border-top: 8px solid var(--red); box-shadow: 0 30px 80px rgba(0,0,0,.5); transform: translateY(24px) scale(.97); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.pubpop.on .box { transform: none; }
.pubpop .box a.go { display: block; text-decoration: none; color: inherit; }
.pubpop .box img { display: block; width: 100%; height: auto; }
.pubpop .txt { padding: 70px 36px 36px; }
.pubpop .txt b { display: block; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(40px, 8vw, 64px); line-height: .95; text-wrap: balance; }
.pubpop .txt span { display: block; margin: 14px 0 24px; color: #d9d6cf; font-size: 19px; line-height: 1.45; max-width: 46ch; }
.pubpop .txt em { display: inline-block; font-style: normal; font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-weight: 700; font-size: 19px; background: var(--green); color: var(--on-green); padding: 14px 24px; }
.pubpop .tag2 { position: absolute; top: 14px; left: 14px; z-index: 2; font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-weight: 700; font-size: 12px; background: var(--beige); color: #12141c; padding: 4px 10px; }
.pubpop .x { position: absolute; top: 10px; right: 10px; z-index: 3; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(12,14,22,.85); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.pubpop .x:hover { background: var(--red); }
.pubpop .bar2 { height: 5px; background: rgba(255,255,255,.16); }
.pubpop .bar2 i { display: block; height: 100%; width: 100%; background: var(--green); transform-origin: left; animation: pubbar linear forwards; }
@keyframes pubbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .pubpop, .pubpop .box { transition: none; } .pubpop .bar2 i { animation: none; } }

/* bloc contact : beige doux, vert en accent */
.cta { background: var(--beige); color: var(--on-beige); border-left: 10px solid #006233; }
.copy { color: #12141c; border-color: #006233; background: transparent; }
.copy:hover { background: #006233; color: #ffffff; }
.copy:focus-visible, .c-row a:focus-visible { outline-color: #006233; }
.c-row a.wa { color: #12141c; }
.cta .c-row a:not(.wa), .cta a:not(.wa) { color: var(--on-beige); }
.cta .c-row a:not(.wa):hover { color: #12141c; }

/* galerie sous le bloc contact */
.gal { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.gal figure { margin: 0; }
.gal a { display: block; text-decoration: none; color: inherit; }
.gal a:hover img { filter: brightness(1.08); }
.gal a:hover figcaption { color: var(--fg); }
.gal img { transition: filter .2s ease; }
.gal img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--surface); }
.gal figcaption { margin-top: 8px; font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: 14px; color: var(--muted); }
.gal li:nth-child(odd) figcaption { border-top: 3px solid var(--green); padding-top: 6px; }
.gal li:nth-child(even) figcaption { border-top: 3px solid var(--red); padding-top: 6px; }
@media (max-width: 820px) { .gal { grid-template-columns: repeat(2, minmax(0, 1fr)); } .gal li:last-child { grid-column: 1 / -1; } .gal li:last-child img { aspect-ratio: 16 / 9; } }
.art.cible { outline: 4px solid var(--green); outline-offset: 6px; animation: cible 2.4s ease-out 1; }
@keyframes cible { 0% { outline-color: var(--red); outline-offset: 14px; } 100% { outline-color: var(--green); outline-offset: 6px; } }
@media (prefers-reduced-motion: reduce) { .art.cible { animation: none; } }

/* pied de page : trois blocs alignés, réseaux sociaux au centre exact */
footer { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 24px; row-gap: 14px; }
footer > span:first-child { justify-self: start; }
footer > span:last-child { justify-self: end; text-align: right; }
footer .follow { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
footer .follow-t { display: block; text-align: center; letter-spacing: .18em; }
footer .social { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 0; padding: 0; }
@media (max-width: 760px) { footer { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } footer > span:first-child, footer > span:last-child { justify-self: center; text-align: center; } footer .follow { order: -1; } }

/* édito en une de magazine : grande photo, titre qui chevauche, grande citation */
.edito-page { display: block; margin-top: 36px; }
.ed-top { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: end; }
.ed-photo { position: relative; margin: 0; z-index: 1; }
.ed-photo img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; box-shadow: 10px 10px 0 var(--beige); }
.ed-photo figcaption { position: absolute; left: 0; bottom: 0; background: var(--beige); color: var(--on-beige); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; padding: 8px 14px; }
.ed-head { position: relative; z-index: 2; margin: 0 0 0 -56px; padding: 26px 0 0 26px; background: var(--bg); align-self: end; }
.ed-head .tag { font-family: var(--display); text-transform: uppercase; letter-spacing: .18em; font-weight: 700; font-size: 16px; color: #12141c; }
.ed-head h1 { margin: 10px 0 0; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(40px, 6vw, 78px); line-height: .94; text-wrap: balance; }
.ed-head h1 em { font-style: normal; color: #12141c; display: block; }
.ed-lede { font-size: clamp(19px, 2.2vw, 24px); line-height: 1.45; color: var(--muted); margin: 34px 0 0; max-width: 60ch; border-left: 4px solid var(--green); padding-left: 18px; }
.ed-body { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 48px; margin-top: 40px; align-items: start; }
.ed-quote { position: sticky; top: 24px; margin: 0; color: #12141c; font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(34px, 4.2vw, 52px); line-height: 1; }
.ed-quote::before { content: "\201C"; display: block; font-size: 2.4em; line-height: .7; height: .5em; margin-bottom: 8px; }
.ed-body .corps p { font-size: 19px; line-height: 1.65; margin: 0 0 18px; max-width: 62ch; }
.ed-body .corps p:first-child::first-letter { font-family: var(--display); font-weight: 700; font-size: 3.6em; line-height: .8; float: left; padding: 6px 10px 0 0; color: #12141c; }
.ed-body .corps strong { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 1.15em; }
@media (max-width: 820px) {
  .ed-top { grid-template-columns: minmax(0, 1fr); }
  .ed-photo img { aspect-ratio: 1 / 1; object-position: 50% 20%; box-shadow: 8px 8px 0 var(--beige); }
  .ed-head { margin: -48px 0 0 14px; padding: 18px 0 0 18px; }
  .ed-body { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .ed-quote { position: static; }
}

/* page de publicité pleine page */
.pubpage { margin-top: 28px; }
.pubpage .mention { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--display); text-transform: uppercase; letter-spacing: .18em; font-weight: 700; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.pubpage .mention a { color: var(--muted); text-decoration: none; letter-spacing: .12em; }
.pubpage .mention a:hover { color: #12141c; }
.pubpage .affiche { display: block; margin: 18px auto 0; max-width: 640px; }
.pubpage .affiche img { display: block; width: 100%; height: auto; box-shadow: 10px 10px 0 var(--beige); }
.pubpage .ici { margin-top: 18px; min-height: 560px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); background: var(--green); color: var(--on-green); box-shadow: 10px 10px 0 var(--beige); }
.pubpage .ici .g { padding: clamp(24px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.pubpage .ici h1 { margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(44px, 6.4vw, 92px); line-height: .9; overflow-wrap: anywhere; }
.pubpage .ici h1 em { font-style: normal; background: var(--beige); color: var(--on-beige); padding: 0 .12em; display: inline-block; }
.pubpage .ici p { margin: 0; font-size: clamp(18px, 2vw, 22px); line-height: 1.5; max-width: 36ch; }
.pubpage .ici .d { background: var(--beige); color: var(--on-beige); padding: clamp(24px, 4vw, 48px); display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.pubpage .ici .d b { font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-size: 18px; }
.pubpage .ici ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 18px; }
.pubpage .ici ul li::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--green); margin-right: 12px; }
.pubpage .ici .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.pubpage .ici .acts a { text-decoration: none; text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: 18px; padding: 14px 18px; background: var(--green); color: var(--on-green); }
.pubpage .ici .acts a.alt { background: transparent; color: var(--on-beige); border: 2px solid var(--on-beige); }
.pubpage .txtpub { margin-top: 18px; padding: clamp(28px, 5vw, 64px); background: var(--surface); box-shadow: 10px 10px 0 var(--beige); text-align: center; }
.pubpage .txtpub h1 { margin: 0 0 14px; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(44px, 8vw, 96px); line-height: .92; }
.pubpage .txtpub p { margin: 0 auto 24px; font-size: 20px; line-height: 1.55; max-width: 46ch; }
.pubpage .suite { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 34px; }
.pubpage .suite .btn-all { background: var(--green); color: var(--on-green); }
@media (max-width: 820px) { .pubpage .ici { grid-template-columns: minmax(0, 1fr); min-height: 0; box-shadow: 6px 6px 0 var(--beige); } }


/* menu resserré (9 onglets) */
.bar nav { gap: 8px 13px; font-size: 13.5px; letter-spacing: .05em; }

/* planche de cases A5 */
.pg-head { margin: 26px 0 0; }
.pg-head h1 { margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(46px, 8vw, 100px); line-height: .92; }
.pg-head h1 em { font-style: normal; color: #12141c; }
.pg-head p { margin: 14px 0 0; font-size: clamp(18px, 2vw, 22px); line-height: 1.5; max-width: 62ch; border-left: 4px solid var(--green); padding-left: 18px; color: var(--muted); }
.a5s { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-top: 28px; }
.a5 { position: relative; display: block; aspect-ratio: 148 / 210; overflow: hidden; text-decoration: none; color: inherit; background: var(--surface); box-shadow: 6px 6px 0 var(--beige); }
.a5.on { box-shadow: 6px 6px 0 var(--beige); }
.a5 > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.a5 .tx { position: absolute; inset: 0; padding: 22px 20px; display: flex; flex-direction: column; gap: 8px; justify-content: center; text-align: center; }
.a5 .tx em { font-style: normal; font-family: var(--display); text-transform: uppercase; letter-spacing: .16em; font-weight: 700; font-size: 14px; color: #12141c; }
.a5 .tx h2 { margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(30px, 3.4vw, 44px); line-height: .95; }
.a5 .tx p { margin: 0; font-size: 16px; line-height: 1.45; }
.a5 .tx strong { font-family: var(--display); font-size: 22px; letter-spacing: .06em; color: #12141c; }
.a5 .tx .go { align-self: center; background: var(--green); color: var(--on-green); font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: 16px; padding: 10px 18px; }
.a5.free { background: var(--beige); color: var(--on-beige); border: 3px dashed #b8975a; box-shadow: none; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 18px 16px; }
.a5.free b { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: clamp(34px, 4vw, 52px); line-height: .9; color: #12141c; }
.a5.free > span { font-size: 15px; line-height: 1.4; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.acts a { text-decoration: none; text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: 15px; padding: 10px 14px; background: var(--green); color: var(--on-green); }
.acts a.alt { background: transparent; color: inherit; border: 2px solid currentColor; }
.tarif { margin: 22px 0 0; font-size: 16px; color: var(--muted); }
.pg-cta { margin-top: 34px; background: var(--green); color: var(--on-green); padding: clamp(20px, 3vw, 34px); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 8px 8px 0 var(--beige); }
.pg-cta b { font-family: var(--display); text-transform: uppercase; font-size: clamp(26px, 3.6vw, 40px); line-height: 1; }
.pg-cta .acts a { background: var(--beige); color: var(--on-beige); }
.pg-cta .acts a.alt { background: transparent; color: var(--on-green); }
@media (max-width: 900px) { .a5s { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }
@media (max-width: 520px) { .a5 .tx { padding: 14px 12px; } .a5 .tx h2 { font-size: 26px; } .a5 .tx p { font-size: 14px; } .a5.free b { font-size: 34px; } .a5.free > span { font-size: 13px; } .pg-cta { box-shadow: 5px 5px 0 var(--beige); } }
@media (max-width: 600px) {
  .a5s { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .a5.on { max-width: 400px; width: 100%; margin: 0 auto; }
  .a5.free { aspect-ratio: auto; padding: 24px 18px; }
  .a5.free b { font-size: 44px; }
  .a5.free b span { display: inline; }
  .a5 .tx h2 { font-size: 34px; }
  .a5 .tx p { font-size: 17px; }
}
.a5.free b span { display: block; }
@media (max-width: 600px) { .a5.free b span { display: inline; } }
.a5.free .gratuit { font-style: normal; font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-weight: 700; font-size: 18px; background: var(--green); color: var(--on-green); padding: 9px 16px; }

/* luxe : beige dominant ; vert réservé aux titres et mots à mettre en valeur */
.btn-all, .a5.free .gratuit, .a5 .tx .go, .pubpage .suite .btn-all, .ph-cta a, .pg-cta .acts a, .pubpage .ici .acts a, .cc-act a, .tform button[type="submit"], .pubpop .txt a, .filters button[aria-pressed="true"] { background: var(--beige) !important; color: var(--on-beige) !important; border: 1px solid #c9b58a !important; }
.btn-all:hover, .ph-cta a:hover, .pg-cta .acts a:hover { background: #dccda9 !important; }
.pg-cta, .ph-cta, .pubpage .ici { background: var(--beige) !important; color: var(--on-beige) !important; box-shadow: none !important; border-top: 3px solid #c9b58a; }
.pg-cta .acts a, .ph-cta a, .pubpage .ici .acts a { background: #fff !important; }
.pg-cta .acts a.alt, .pubpage .ici .acts a.alt { background: transparent !important; border: 2px solid var(--on-beige) !important; }
.pubpage .ici .d { background: #fff; }
.pubpage .ici h1 em { background: transparent; color: #12141c; padding: 0; }
.pg-head p, .ph-head p, .ed-lede { border-left-color: #cdb98d !important; }
.sec-title::before, .logo .no1, .grid > .art:nth-child(even) .play, .social a:hover { background: var(--beige) !important; color: var(--on-beige) !important; border-color: #c9b58a !important; }
.a5.free b { color: var(--on-beige) !important; }
.cov-lines a:first-child { background: var(--beige) !important; color: var(--on-beige) !important; }
.bt-fab { background: var(--beige) !important; color: var(--on-beige) !important; border: 1px solid #c9b58a !important; }
.qrbox, .cbar { border-color: #c9b58a !important; }

/* titres : mot fort en beige doré, le reste de l'écriture en noir */
h1 em, .ed-head h1 em, .pubpage .ici h1 em, .bi-head h1 em, .ph-head h1 em { color: #b8975a !important; }

/* nav 12 */
@media (min-width: 900px) { .bar nav { gap: 6px 11px !important; } .bar nav a { font-size: 12.5px !important; letter-spacing: .03em !important; } }
.pubpage .pg-cta { margin-top: 56px; background: #fff !important; border-top: 6px solid var(--green) !important; border-left: 0; padding: clamp(24px, 3.4vw, 40px); gap: 22px; }
.pubpage .pg-cta .acts { display: flex; gap: 12px; flex-wrap: wrap; }
.pubpage .pg-cta .acts a { min-width: 150px; text-align: center; padding: 14px 20px; }
.a5.free a.gratuit { text-decoration: none; display: inline-block; cursor: pointer; }
.bi-mini { margin: 40px 0 0; background: #f3ead6; border-left: 6px solid #b8975a; padding: 20px 24px; color: #12141c; }
.bi-mini h2 { margin: 0 0 14px; font-family: var(--display); text-transform: uppercase; font-size: 28px; line-height: 1; }
.bi-mini-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.bi-mini h3 { margin: 0 0 6px; font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: #006233; }
.bi-mini p { margin: 0; font-size: 15px; line-height: 1.5; }
.bi-mini .note { margin: 14px 0 0; font-size: 14px; color: #555a69; }
@media (max-width: 900px) { .bi-mini-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .bi-mini-grid { grid-template-columns: minmax(0, 1fr); } }
.pg-pour { margin: 0 0 26px; max-width: 720px; background: #f3ead6; border-left: 6px solid #b8975a; padding: 16px 20px; color: #12141c; }
.pg-pour b { display: block; margin: 0 0 6px; font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 18px; color: #006233; }
.pg-pour p { margin: 0 0 6px; font-size: 16px; line-height: 1.5; }
.pg-pour p:last-child { margin: 0; }

/* menu à listes déroulantes */
.bar nav details.dd>summary{border-bottom:2px solid transparent;padding-bottom:0;margin-bottom:0!important;width:auto;font-family:inherit;text-transform:inherit;font-weight:inherit}
.bar nav details.dd.on>summary{border-bottom-color:var(--red)}
.bar nav .dd{position:relative}
.bar nav .dd>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:inherit;padding:0}
.bar nav .dd>summary::-webkit-details-marker{display:none}
.bar nav .dd>summary::after{content:" ▾";font-size:.8em}
.bar nav .dd[open]>summary,.bar nav .dd>summary:hover{color:var(--fg)}
.bar nav .dd.on>summary{border-bottom:2px solid var(--red)}
.bar nav .dd-m{position:absolute;top:calc(100% + 8px);left:0;z-index:50;min-width:210px;background:var(--bg,#fff);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;padding:6px 0}
.bar nav .dd-m a{padding:10px 16px;white-space:nowrap;border-bottom:0!important}
.bar nav .dd-m a[aria-current="page"]{color:var(--fg);font-weight:800}
.bar nav a,.bar nav .dd>summary{font-size:13.5px;letter-spacing:.05em}
@media (min-width:900px){.bar nav a,.bar nav .dd>summary{font-size:12.5px;letter-spacing:.03em}}
