<!doctype html>
<html lang="fr">
<head>

<title>Tableau de bord · Bondy TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--ink:#12141c;--bg:#f6f4f1;--gold:#b8975a;--green:#006233;--red:#a30f18;--line:#ddd8cf;--muted:#555a69}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Barlow',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:1 1 250px;max-width:270px;min-width:230px;background:var(--ink);color:#f4f2ee;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:flex-end;gap:8px;padding:0 8px 18px}
.brand b{font:italic 800 44px/.85 'Barlow Condensed',sans-serif}.brand b i{color:#e8222d;font-style:italic}
.brand span{font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding-bottom:2px}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:46px;border:0;border-radius:8px;padding:0 14px;font-size:17px;font-weight:600;text-align:left;color:#f4f2ee;background:transparent}
.nav.on{background:var(--gold);color:var(--ink)}
.nav small{font:700 15px 'Barlow Condensed',sans-serif;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 9px}
.nav.on small{background:rgba(0,0,0,.15)}
.aside-note{margin-top:auto;padding:16px 8px 0;font-size:14px;color:#c9c4b8}
.aside-note a{color:#fff}
main{flex:999 1 560px;min-width:0;padding:28px 32px 80px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font:700 40px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.sub{margin:6px 0 0;color:var(--muted);font-size:17px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dirty{font-weight:600;font-size:15px;color:#8a6d2e;background:#f3ead6;border-radius:999px;padding:8px 14px}
.dirty.ok{background:none;color:var(--green)}
.btn{min-height:46px;border:1px solid #bdb7aa;background:#fff;border-radius:8px;padding:0 18px;font-weight:600}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.btn.green{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-height:48px;padding:0 26px;font-size:17px}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.btn.sq{width:44px;padding:0;font-size:18px}.btn.warn{border-color:#e3b4b7;color:var(--red);font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}
.toast{border-radius:8px;padding:14px 18px;margin-bottom:20px;font-weight:600;background:var(--green);color:#fff}
.toast.err{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.stat{padding:18px 20px}.stat b{display:block;font:700 48px/1 'Barlow Condensed',sans-serif}.stat span{color:var(--muted);font-size:15px}
h2{margin:0 0 14px;font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{text-align:left;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,#12141c);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile b{font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase}.tile em{font-style:normal;margin-top:auto;font-weight:600;color:var(--green);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 240px;min-height:48px;border:1px solid #bdb7aa;border-radius:8px;padding:0 14px;font-size:17px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{min-height:40px;border-radius:999px;padding:0 16px;font-size:15px;font-weight:600;border:1px solid #bdb7aa;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #eee7d8;background:#fff}
.row.draft{background:#faf7ef}
.row .n{flex:0 0 44px;font:700 28px 'Barlow Condensed',sans-serif;color:var(--muted);text-align:center}
.row .t{flex:1 1 260px;min-width:0}.row .t b{display:block;font-size:18px;font-weight:600;line-height:1.25}
.meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
.st{font-size:14px;font-weight:600;color:var(--green)}.draft .st{color:#8a6d2e}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:17px}
.hint{color:var(--muted);font-size:15px;margin:14px 2px 0}
/* tiroir */
.veil{position:fixed;inset:0;background:rgba(18,20,28,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{width:min(620px,100%);height:100%;background:#fff;overflow:auto;padding:26px 28px 0;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer h2{font-size:30px;margin:0}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 0;margin-top:20px;display:flex;flex-wrap:wrap;gap:12px}
.fld{margin-bottom:18px}.fld>label,.fld>.lb{display:block;font-weight:600;margin-bottom:6px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;border:1px solid #bdb7aa;border-radius:8px;padding:0 14px;font-size:17px;background:#fff}
.fld input[type=text],.fld input[type=number],.fld select{min-height:46px}
.fld textarea{padding:12px 14px;line-height:1.5;resize:vertical}
.fld .help{color:var(--muted);font-size:14px;margin-top:4px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}.chk input{width:22px;height:22px}
.img{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px dashed #bdb7aa;border-radius:10px;padding:12px}
.img .th{width:84px;height:84px;border-radius:8px;background:#ece6d8 center/cover;display:flex;align-items:center;justify-content:center;font:12px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.sect{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px;background:#fcfbf8}
.sect>.lb{font:700 18px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:block}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff}
.item .ih{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}.item .ih b{font-weight:600}
details.adv{margin-bottom:18px}
.mp{border:1px solid #d9cfb8;background:#faf6ec;border-radius:10px;padding:16px;margin:6px 0 20px}.mp h3{margin:0 0 4px;font-size:22px}.mp .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.mp .grp{margin:12px 0}.mp .grp>b{display:block;margin-bottom:6px}.mp .seg{display:flex;flex-wrap:wrap;gap:6px}.mp .seg button{min-height:44px;border:1px solid #bdb7aa;background:#fff;border-radius:8px;padding:0 14px;font-weight:600}.mp .seg button[aria-checked=true]{background:var(--green);border-color:var(--green);color:#fff}
.mpv{display:flex;gap:8px;border:1px solid #bdb7aa;background:#fff;border-radius:8px;padding:10px;margin-top:10px;min-height:150px}.mpv .ph{background:#d9cfb8;border-radius:4px;display:grid;place-items:center;font-size:12px;color:#6b624a}.mpv .tx{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:center}.mpv .tx i{display:block;background:#c9c7c0;border-radius:2px;height:5px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tb button{min-height:40px;border:1px solid #bdb7aa;background:#fff;border-radius:8px;padding:0 12px;font-weight:600}details.adv>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.panel{max-width:820px;padding:24px}
.login{max-width:520px;margin:12vh auto;padding:32px;text-align:center}
.login p{color:var(--muted);font-size:17px}
.spin{padding:60px;text-align:center;color:var(--muted);font-size:18px}
@media (max-width:700px){main{padding:20px 14px 80px}h1{font-size:32px}}
</style>
</head>
