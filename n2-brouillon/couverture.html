<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@page{size:210mm 297mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#000}
.c{position:relative;width:210mm;height:297mm;overflow:hidden;background:#1a0d06;font-family:'Barlow',sans-serif;color:#fff}
.c>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.sh{position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(15,7,3,.75),rgba(15,7,3,0))}
.sb{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(0deg,rgba(15,7,3,.8),rgba(15,7,3,0))}
.logo{position:absolute;top:12mm;left:13mm}.logo img{width:58mm;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.t{position:absolute;left:13mm;top:50mm;width:105mm}
.t small{display:block;font:600 10.5pt 'Barlow Condensed',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#f2d49a}
.t h1{margin:3mm 0 0;font:700 66pt/.86 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#f6e3b4;text-shadow:0 0 22px rgba(255,190,90,.6),0 3px 0 #7a4a14}
.t h1 em{display:block;font-style:normal;color:#fff}
.t p{margin:5mm 0 0;font:italic 500 13pt/1.3 'Barlow',sans-serif;color:#f3dcc0;max-width:100mm;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8mm 13mm;display:flex;justify-content:space-between;align-items:flex-end;font:700 9.5pt 'Barlow Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f2d49a}
.bar b{font-size:20pt;color:#fff;letter-spacing:.06em}
</style></head><body><div class="c">
<img class="bg" src="/n2-brouillon/noel-couverture.jpg" alt="">
<div class="sh"></div><div class="sb"></div>
<div class="logo"><img src="/magazine/img/logo-blanc.png" alt=""></div>
<div class="t"><small>Décembre 2026</small><h1>Noël<em>à Bondy</em></h1><p>Lumières, souvenirs d’enfance et gens d’ici</p></div>
<div class="bar"><span>Le magazine gratuit des Bondynois</span><b>N°2</b></div>
</div></body></html>
