<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Modération : élus et habitants</title>
<style>
:root{--bg:#f6f4f1;--fg:#12141c;--muted:#555a69;--green:#006233;--red:#d3141f;--beige:#e8dcc0;--line:rgba(18,20,28,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Barlow,Arial,sans-serif;padding:20px}
.w{max-width:980px;margin:0 auto}h1{font:700 40px/1 "Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;margin:0 0 6px;color:var(--green)}
h2{font:700 26px/1 "Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;margin:30px 0 12px}
input,textarea,select{font:inherit;padding:10px;border:2px solid var(--line);background:#fff;width:100%}
button{font:700 15px/1 "Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:12px 16px;border:0;cursor:pointer;background:var(--fg);color:#fff}
button.g{background:var(--green)}button.r{background:var(--red)}button.l{background:#fff;color:var(--fg);border:2px solid var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar input{max-width:300px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.c{background:#fff;border-top:6px solid var(--beige);padding:16px;margin:12px 0}.c.att{border-top-color:var(--red)}.c.pub{border-top-color:var(--green)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}.m{color:var(--muted);font-size:14px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;background:var(--beige);padding:2px 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.code{background:#f3ead6;border-left:6px solid #b8975a;padding:16px;margin:14px 0;font-size:18px}.code b{font:700 30px/1.2 "Barlow Condensed",Arial Narrow,sans-serif;letter-spacing:.12em}
pre{white-space:pre-wrap;background:#fff;border:2px solid var(--line);padding:12px;margin:10px 0}
</style></head><body><div class="w">
<h1>Modération : élus et habitants</h1><p class="m">Page privée. Ne donnez jamais ce mot de passe. C'est le même que celui de la modération.</p>
<div class="bar"><input type="password" id="pw" placeholder="Mot de passe de modération" autocomplete="current-password"><button class="g" id="go">Entrer</button></div>
<p id="err" class="m" style="color:var(--red)"></p>
<div id="app" hidden>
<h2>Demandes d'accès des habitants</h2>
<div id="dm"></div>
<div id="newh"></div>
<h2>Créer un compte d'élu</h2>
<p class="m">Faites-le seulement après avoir vérifié son justificatif d'élu.</p>
<div class="grid"><div><label>Prénom et nom<input id="n" placeholder="Prénom Nom"></label></div><div><label>Fonction<input id="f" placeholder="Conseiller municipal"></label></div><div><label>Groupe (facultatif)<input id="g" placeholder="Majorité, opposition…"></label></div></div>
<div class="bar"><button class="g" id="mk">Créer le compte</button></div>
<div id="new"></div>
<h2>Tribunes à relire</h2>
<div class="bar"><select id="flt" style="max-width:240px"><option value="att">À relire</option><option value="all">Toutes</option><option value="pub">Publiées</option></select></div>
<div id="tl"></div>
<h2>Comptes</h2>
<div id="cl"></div>
</div>
<script>
(function(){
function $(i){return document.getElementById(i)}
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tok(){try{return sessionStorage.getItem("mod")||""}catch(x){return ""}}
function api(body){var o={headers:{"Authorization":"Bearer "+tok(),"Content-Type":"application/json"}};if(body){o.method="POST";o.body=JSON.stringify(body)}return fetch("/api/tribune-admin",o).then(function(r){return r.json().then(function(j){j.status=r.status;return j})})}
var data={comptes:[],tribunes:[],demandes:[]};
function load(){api().then(function(j){if(j.status===401){$("err").textContent="Mot de passe incorrect.";$("app").hidden=true;return}if(j.status===503){$("err").textContent="Le service n'est pas encore branché (KV VOTES) ou le mot de passe n'est pas créé.";return}$("err").textContent="";$("app").hidden=false;data=j;draw()})}
function st(t){return t.statut==="publie"?"pub":t.statut==="attente"?"att":"x"}
var LBL={attente:"À relire",publie:"Publiée",refuse:"Refusée",retire:"Retirée"};
function draw(){var f=$("flt").value;
 $("tl").innerHTML=data.tribunes.filter(function(t){return f==="all"||st(t)===f}).map(function(t,i){
  return '<div class="c '+st(t)+'"><div class="top"><span>'+(t.role==="habitant"?'[Habitant] ':'[Élu] ')+e(t.nom)+(t.role==="habitant"?'':' · '+e(t.fonction)+(t.groupe?' · '+e(t.groupe):''))+'</span><span class="tag">'+e(LBL[t.statut]||t.statut)+'</span></div><p class="m">'+new Date(t.ts).toLocaleString("fr-FR")+'</p><h3 style="margin:6px 0">'+e(t.titre)+'</h3><textarea rows="7" data-t="'+e(t.cle)+'">'+e(t.texte)+'</textarea>'+(t.lien?'<p><a href="'+e(t.lien)+'" target="_blank" rel="noopener">'+e(t.lien)+'</a></p>':'')+
  '<div class="act"><button class="g" data-a="publier" data-k="'+e(t.cle)+'">Publier</button><button class="r" data-a="refuser" data-k="'+e(t.cle)+'">Refuser</button>'+(t.statut==="publie"?'<button class="l" data-a="retirer" data-k="'+e(t.cle)+'">Retirer du site</button>':'')+'</div></div>'}).join("")||'<p class="m">Rien à afficher.</p>';
 drawDem();
 $("cl").innerHTML=data.comptes.map(function(a){return '<div class="c"><div class="top"><span>'+(a.role==="habitant"?'[Habitant] '+e(a.nom)+(a.tel?' · '+e(a.tel):''):'[Élu] '+e(a.nom)+' · '+e(a.fonction)+(a.groupe?' · '+e(a.groupe):''))+'</span><span class="tag">'+(a.actif?"Actif":"Désactivé")+'</span></div><p class="m">Identifiant : <b>'+e(a.id)+'</b></p><div class="act"><button class="l" data-c="nouveau_code" data-i="'+e(a.id)+'">Nouveau code</button><button class="l" data-c="'+(a.actif?"desactiver":"activer")+'" data-i="'+e(a.id)+'">'+(a.actif?"Désactiver":"Réactiver")+'</button></div></div>'}).join("")||'<p class="m">Aucun compte pour l\'instant.</p>';
}
function drawDem(){var L=data.demandes||[];
 $("dm").innerHTML=L.length?L.map(function(d){var lbl={attente:"À traiter",accepte:"Accepté",refuse:"Refusé"}[d.statut]||d.statut;
  return '<div class="c '+(d.statut==="attente"?"att":d.statut==="accepte"?"pub":"")+'"><div class="top"><span>'+e(d.nom)+' · <a href="tel:'+e(d.tel)+'">'+e(d.tel)+'</a>'+(d.adresse?' · '+e(d.adresse):(d.quartier?' · '+e(d.quartier):''))+'</span><span class="tag">'+e(lbl)+'</span></div><p class="m">'+new Date(d.ts).toLocaleString("fr-FR")+'</p><div class="act">'+(d.statut==="attente"?'<button class="g" data-d="accepter" data-k="'+e(d.cle)+'">Accepter et créer le code</button><button class="r" data-d="refuser_demande" data-k="'+e(d.cle)+'">Refuser</button>':'')+'<button class="l" data-d="supprimer_demande" data-k="'+e(d.cle)+'">Supprimer</button></div></div>'}).join(""):'<p class="m">Aucune demande pour l\'instant.</p>';
}
function showHab(j){var msg="Bonjour "+j.nom+", voici votre accès à La parole aux habitants de Bondy TV Magazine.\nAdresse : "+location.origin+"/habitant.html\nIdentifiant : "+j.id+"\nCode : "+j.code+"\nGardez ce code pour vous. Vous écrivez votre texte, nous le relisons, puis il est publié.";
 var num=String(j.tel||"").replace(/\D/g,"");
 $("newh").innerHTML='<div class="code">Compte habitant prêt. Ce code ne sera plus affiché.<br>Identifiant : <b>'+e(j.id)+'</b><br>Code : <b>'+e(j.code)+'</b></div><pre>'+e(msg)+'</pre><div class="bar"><a href="https://wa.me/'+e(num)+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener"><button class="g" type="button">Envoyer par WhatsApp à '+e(j.tel)+'</button></a><a href="sms:'+e(j.tel)+'?&body='+encodeURIComponent(msg)+'"><button class="l" type="button">Envoyer par SMS</button></a><button class="l" id="cph" type="button">Copier le message</button></div>';
 $("cph").onclick=function(){navigator.clipboard.writeText(msg).then(function(){$("cph").textContent="Copié"})}}
function showCode(id,code,nom){var msg="Bonjour "+nom+", voici votre accès à l'espace des élus de Bondy TV Magazine.\nAdresse : "+location.origin+"/elu.html\nIdentifiant : "+id+"\nCode : "+code+"\nGardez ce code pour vous. Vous écrivez votre tribune, nous la relisons, puis elle est publiée.";
 $("new").innerHTML='<div class="code">Compte prêt. Ce code ne sera plus affiché : copiez le message maintenant.<br>Identifiant : <b>'+e(id)+'</b><br>Code : <b>'+e(code)+'</b></div><pre id="mm">'+e(msg)+'</pre><div class="bar"><button class="g" id="cp">Copier le message</button></div>';
 $("cp").onclick=function(){navigator.clipboard.writeText(msg).then(function(){$("cp").textContent="Copié"})}}
$("go").onclick=function(){try{sessionStorage.setItem("mod",$("pw").value)}catch(x){}load()};
$("pw").addEventListener("keydown",function(ev){if(ev.key==="Enter")$("go").click()});
$("flt").onchange=draw;
$("mk").onclick=function(){var nom=$("n").value.trim();api({action:"creer",nom:nom,fonction:$("f").value,groupe:$("g").value}).then(function(j){if(j.ok){showCode(j.id,j.code,nom);$("n").value=$("f").value=$("g").value="";load()}else alert(j.error==="existe"?"Un compte avec ce nom existe déjà.":j.error==="nom"?"Écrivez le prénom et le nom.":"Erreur : "+(j.error||j.status))})};
$("tl").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;var a=b.dataset.a,k=b.dataset.k,body={action:a,cle:k};
 if(a==="publier"){var ta=document.querySelector('textarea[data-t="'+k+'"]');body.texte=ta?ta.value:""}
 if(a==="refuser"){var m=prompt("Motif du refus (l'élu le verra) :");if(m===null)return;body.motif=m}
 if(a==="retirer"&&!confirm("Retirer cette tribune du site ?"))return;
 api(body).then(function(j){if(j.ok)load();else alert("Erreur : "+(j.error||j.status))})});
$("cl").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;var c=b.dataset.c,i=b.dataset.i;
 if(c==="nouveau_code"&&!confirm("Créer un nouveau code ? L'ancien ne marchera plus."))return;
 api({action:c,id:i}).then(function(j){if(!j.ok){alert("Erreur : "+(j.error||j.status));return}var a=data.comptes.filter(function(x){return x.id===i})[0]||{};if(j.code)showCode(i,j.code,a.nom||i);load()})});
$("dm").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b||!b.dataset.d)return;var a=b.dataset.d;
 if(a==="supprimer_demande"&&!confirm("Supprimer cette demande ?"))return;
 if(a==="refuser_demande"&&!confirm("Refuser cette demande ?"))return;
 api({action:a,cle:b.dataset.k}).then(function(j){if(!j.ok){alert("Erreur : "+(j.error||j.status));return}if(a==="accepter")showHab(j);load()})});
if(tok())load();
})();
</script></div></body></html>
